name: 自动解压数据包

on:
  # 当 main 或 master 分支有代码推送时触发
  push:
    branches: [ main, master ]
    paths:
      - '*.zip'        # 任何 zip 文件变动都会触发
      - 'data.zip'     # 或者只要 data.zip 变动

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装解压工具
        run: sudo apt-get install -y unzip

      - name: 解压并覆盖文件
        run: |
          # 删除现有的 data 文件夹（避免旧文件残留）
          rm -rf data/
          # 解压 data.zip 到当前目录
          unzip -o data.zip -d ./
          # 可选：解压后删除 zip 包以保持整洁
          rm -f data.zip
        continue-on-error: true

      - name: 提交并推送解压后的文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "自动解压数据包 [skip ci]" || echo "没有变化需要提交"
          git push
